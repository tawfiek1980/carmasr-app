<svg viewBox="0 0 1024 1024" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1024" y2="1024" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#070e1a"/>
      <stop offset="0.5" stop-color="#0D1B2A"/>
      <stop offset="1" stop-color="#0f2238"/>
    </linearGradient>
    <linearGradient id="orangeGrad" x1="380" y1="440" x2="660" y2="880" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fdba74"/>
      <stop offset="0.5" stop-color="#f97316"/>
      <stop offset="1" stop-color="#c2410c"/>
    </linearGradient>
    <linearGradient id="whiteShine" x1="200" y1="260" x2="800" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e2e8f0"/>
    </linearGradient>
    <radialGradient id="glowOrange" cx="0.5" cy="0.65" r="0.45" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="1" stop-color="#f97316" stop-opacity="0"/>
    </radialGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="24" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="innerGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="12" result="blur"/>
      <feComposite in="blur" in2="SourceGraphic" operator="over"/>
    </filter>
    <filter id="orangeGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="28" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="roundClip">
      <rect width="1024" height="1024" rx="224"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1024" height="1024" rx="224" fill="url(#bgGrad)"/>
  <rect x="12" y="12" width="1000" height="1000" rx="218" fill="none" stroke="rgba(255,255,255,0.04)" stroke-width="2"/>

  <!-- Subtle radial glow behind the letter -->
  <circle cx="512" cy="560" r="340" fill="url(#glowOrange)" clip-path="url(#roundClip)"/>

  <!-- Decorative dots -->
  <circle cx="860" cy="160" r="8" fill="rgba(249,115,22,0.12)"/>
  <circle cx="880" cy="200" r="4" fill="rgba(249,115,22,0.08)"/>
  <circle cx="164" cy="820" r="6" fill="rgba(249,115,22,0.08)"/>
  <circle cx="820" cy="840" r="5" fill="rgba(255,255,255,0.03)"/>

  <!-- The "ط" letter with shadow -->
  <g filter="softShadow">
    <!-- Horizontal bar -->
    <rect x="180" y="280" width="660" height="110" rx="55" fill="url(#whiteShine)"/>
    <!-- Vertical tail with orange gradient -->
    <rect x="430" y="390" width="164" height="420" rx="82" fill="url(#orangeGrad)" filter="url(#orangeGlow)"/>
  </g>

  <!-- Highlight line on bar -->
  <rect x="220" y="296" width="580" height="4" rx="2" fill="rgba(255,255,255,0.25)"/>

  <!-- Small highlight on tail -->
  <rect x="462" y="420" width="6" height="320" rx="3" fill="rgba(255,255,255,0.15)"/>
</svg>
